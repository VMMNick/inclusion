<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Лабораторія логіки та сортування</title>
  <meta name="description" content="Навчальний вебдодаток з логіки та інформатики для учнів 3–5 класів" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧪</text></svg>" />
</head>

<!--
  Оболонка застосунку. Самі екрани (вітання, завдання, нагорода) будує src/app.js
  з модулів у src/features/ — сюди їх додавати не потрібно.
-->
<body class="bg-cream text-ink font-sans min-h-screen flex flex-col">

  <!-- Верхня панель: назва, кроки, звук -->
  <header class="bg-white/90 border-b-2 border-lavender-mid sticky top-0 z-10">
    <div class="max-w-6xl mx-auto px-4 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-2">
        <span class="text-3xl" aria-hidden="true">🧪</span>
        <span class="font-extrabold text-lg sm:text-xl">Лабораторія логіки</span>
      </div>

      <button id="sound-toggle" type="button" aria-pressed="false"
        class="flex items-center gap-2 px-4 py-2 rounded-full bg-sky-soft border-2 border-sky-mid font-bold hover:bg-sky-mid lg:order-last">
        <span id="sound-icon" aria-hidden="true">🔇</span>
        <span id="sound-label">Звук вимкнено</span>
      </button>

      <nav aria-label="Кроки уроку" class="w-full lg:w-auto">
        <ol id="stepper" class="flex flex-wrap items-center justify-center gap-1 sm:gap-1.5"></ol>
      </nav>
    </div>
  </header>

  <!-- Сюди монтуються всі екрани -->
  <main id="app" class="flex-1 w-full max-w-6xl mx-auto px-4 py-6 sm:py-10"></main>

  <!-- Вікно тематичного сертифіката -->
  <div id="cert-modal" class="hidden fixed inset-0 z-50 bg-ink/40 overflow-y-auto p-4" role="dialog" aria-modal="true" aria-labelledby="cm-title">
    <div class="max-w-2xl mx-auto my-6">
      <div id="cm-card"></div>
      <div class="no-print mt-4 bg-white rounded-3xl border-2 border-lavender-mid p-4 sm:p-5">
        <label for="cm-name" class="block text-lg font-bold mb-1">✏️ Кому видається сертифікат:</label>
        <p class="text-base text-ink/70 mb-2">Ім’я та прізвище. Залиш порожнім, якщо хочеш вписати ім’я ручкою після друку.</p>
        <input id="cm-name" type="text" maxlength="60" autocomplete="off" placeholder="Наприклад: Олеся Коваленко"
          class="w-full text-xl px-5 py-3 rounded-2xl border-2 border-lavender-mid bg-white mb-4" />
        <div class="flex flex-wrap gap-3 justify-center">
          <button id="cm-print" type="button" class="px-6 py-3 rounded-full bg-butter-mid border-2 border-butter-mid font-extrabold hover:bg-butter-soft">🖨️ Надрукувати</button>
          <button id="cm-close" type="button" class="px-6 py-3 rounded-full bg-lavender-deep text-white font-extrabold hover:opacity-90">✖ Закрити</button>
        </div>
      </div>
    </div>
  </div>

  <footer class="text-center text-sm text-ink/60 py-4 border-t-2 border-lavender-soft">
    Лабораторія логіки та сортування · v<span id="app-version"></span> · без таймерів, у своєму темпі 🌱
  </footer>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
